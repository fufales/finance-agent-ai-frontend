name: Deploy PFinances AI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install Dependencies
        working-directory: app
        run: npm ci

      - name: Build Vite App
        working-directory: app
        run: npm run build

      - name: Install SSHPass and RSYNC
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass rsync

      - name: Install cloudflared (SSH via Cloudflare Tunnel)
        run: |
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared
          cloudflared --version

      - name: Start Cloudflare Tunnel TCP proxy (SSH -> vps1)
        run: |
          nohup cloudflared access tcp \
            --hostname sshfinances.klooid.com \
            --url 127.0.0.1:2222 \
            --log-level error > /tmp/cf-tcp.log 2>&1 &
          # wait for the local proxy port to accept connections
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/2222) 2>/dev/null; then
              echo "tunnel proxy ready"
              break
            fi
            sleep 1
          done

      - name: Create destination directory if not exists
        run: |
          sshpass -p "${{ secrets.SSH_PASS }}" ssh -p 2222 -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@127.0.0.1 "mkdir -p /home/chris/ondemand/sites/finances-app"

      - name: Deploy files using RSYNC (via tunnel)
        run: |
          sshpass -p "${{ secrets.SSH_PASS }}" rsync -avz --delete \
            -e "ssh -p 2222 -o StrictHostKeyChecking=no" \
            app/dist/ ${{ secrets.SSH_USER }}@127.0.0.1:/home/chris/ondemand/sites/finances-app/

      - name: Verify deployment
        run: |
          sshpass -p "${{ secrets.SSH_PASS }}" ssh -p 2222 -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@127.0.0.1 "ls -la /home/chris/ondemand/sites/finances-app/ | head -20"
